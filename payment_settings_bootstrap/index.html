<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Payment</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="payment-page">

    <section class="settings-card">

      <div class="text-center mb-4">
        <h1>Settings</h1>
        <div class="page-subtitle">Payment</div>
      </div>


      <h2 class="section-title">Saved cards:</h2>


      <div class="saved-card-row">

        <div class="card-brand mastercard" aria-label="Mastercard">
          <span></span>
          <span></span>
          <small>mastercard</small>
        </div>

        <div class="card-input-wrap flex-grow-1">
          <label>Card Number</label>

          <div class="masked-number">
            **** **** **** 1234
          </div>
        </div>

        <button class="remove-btn" type="button">
          Remove card
        </button>

      </div>


      <div class="saved-card-row">

        <div class="card-brand visa" aria-label="Visa">
          VISA
        </div>

        <div class="card-input-wrap flex-grow-1">
          <label>Card Number</label>

          <div class="masked-number">
            **** **** **** 5678
          </div>
        </div>

        <button class="remove-btn" type="button">
          Remove card
        </button>

      </div>


      <h2 class="section-title add-title">
        Add new card:
      </h2>


      <form id="cardForm">

        <div class="floating-field mb-3">

          <label for="name">
            Cardholder's Name
          </label>

          <input
            id="name"
            type="text"
            value="Basima Amin Mustafa Thaher"
            autocomplete="cc-name"
          >

        </div>


        <div class="row g-3">

          <div class="col-md-5">

            <div class="floating-field">

              <label for="number">
                Card Number
              </label>

              <input
                id="number"
                type="text"
                placeholder="1234 5678 1234 5678"
                inputmode="numeric"
                autocomplete="cc-number"
              >

            </div>

          </div>


          <div class="col-md-3">

            <div class="floating-field">

              <label for="expire">
                Expire
              </label>

              <input
                id="expire"
                type="text"
                placeholder="MM/YY"
                inputmode="numeric"
                autocomplete="cc-exp"
              >

            </div>

          </div>


          <div class="col-md-4">

            <div class="floating-field">

              <label for="cvv">
                Cvv
              </label>

              <input
                id="cvv"
                type="password"
                placeholder="***"
                inputmode="numeric"
                autocomplete="cc-csc"
                maxlength="4"
              >

            </div>

          </div>

        </div>


        <button
          class="add-card-btn"
          type="submit"
        >
          ADD CARD
        </button>

      </form>

    </section>

  </main>


  <script>

    document
      .getElementById('cardForm')
      .addEventListener('submit', function(e) {

        e.preventDefault();

        alert('Card form submitted.');

      });


    document
      .querySelectorAll('.remove-btn')
      .forEach(function(btn) {

        btn.addEventListener('click', function() {

          this
            .closest('.saved-card-row')
            .remove();

        });

      });

  </script>

</body>
</html>
